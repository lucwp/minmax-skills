name: Update skill catalog

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/update_readme.py'
      - '.github/workflows/update-skill-catalog.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-skill-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate catalog
        run: python3 scripts/update_readme.py

      - name: Commit catalog when changed
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "Catalog already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update skill catalog"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another main update; reconciling (attempt ${attempt}/3)."
            git fetch origin main
            git rebase origin/main
            python3 scripts/update_readme.py
            git add README.md

            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          done

          echo "Failed to update catalog after 3 attempts."
          exit 1

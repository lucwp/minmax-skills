name: Update skill catalog

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/update_readme.py'
      - '.github/workflows/update-skill-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate catalog
        run: python3 scripts/update_readme.py

      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Catalog already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update skill catalog"
          git push

name: Reliability

on:
  push:
    paths:
      - 'skills/**'
      - 'RELIABILITY.md'
      - 'scripts/validate_reliability.py'
      - '.github/workflows/reliability.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'RELIABILITY.md'
      - 'scripts/validate_reliability.py'
      - '.github/workflows/reliability.yml'

permissions:
  contents: read

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate active skill reliability
        run: python scripts/validate_reliability.py --repo-root . --run-tests
